<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the Agent Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #f3f3f0; --dot: #d3d2cb; --frame: rgba(255,255,255,.72); --frame-line: #e2e1da;
    --card: #ffffff; --ink: #1f1f1d; --muted: #75746d; --line: #dcdbd4;
    --you: #4262ff; --you-soft: #e8ebff;
    --local: #12a073; --local-soft: #e2f5ee;
    --cloud: #f08a24; --cloud-soft: #fff0e0;
    --store: #8a5cf6; --store-soft: #f0eaff;
    --sticky: #ffe97a; --sticky-ink: #4a3f12;
    --edge: #b9b8b0; --ui: #ffffff; --shadow: 0 8px 30px rgba(0,0,0,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --board: #18181a; --dot: #2f2f33; --frame: rgba(36,36,40,.8); --frame-line: #34343a;
      --card: #242428; --ink: #ececea; --muted: #9a9a96; --line: #3a3a40;
      --you: #7d93ff; --you-soft: #22284a; --local: #3fcf9a; --local-soft: #173328;
      --cloud: #ffaa55; --cloud-soft: #3a2a18; --store: #a98bff; --store-soft: #2a2244;
      --sticky: #e8cf5a; --sticky-ink: #2e2708; --edge: #55555c; --ui: #242428; --shadow: 0 8px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --board: #18181a; --dot: #2f2f33; --frame: rgba(36,36,40,.8); --frame-line: #34343a;
    --card: #242428; --ink: #ececea; --muted: #9a9a96; --line: #3a3a40;
    --you: #7d93ff; --you-soft: #22284a; --local: #3fcf9a; --local-soft: #173328;
    --cloud: #ffaa55; --cloud-soft: #3a2a18; --store: #a98bff; --store-soft: #2a2244;
    --sticky: #e8cf5a; --sticky-ink: #2e2708; --edge: #55555c; --ui: #242428; --shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--board); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg#board { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; }
  svg#board.dragging { cursor: grabbing; }
  svg text { font-family: Inter, -apple-system, sans-serif; fill: var(--ink); }

  /* Frames */
  .frame rect { fill: var(--frame); stroke: var(--frame-line); stroke-width: 2; }
  .frame text { font-size: 26px; font-weight: 700; fill: var(--muted); }

  /* Nodes */
  .node { opacity: .28; transition: opacity .5s; }
  .node.on { opacity: 1; }
  .node .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; filter: drop-shadow(0 4px 10px rgba(0,0,0,.08)); transition: stroke .3s, stroke-width .3s; }
  .node .ring { fill: none; stroke-width: 3; opacity: 0; }
  .node.active .ring { animation: pulse 1.6s ease-out infinite; }
  .node.you .ring { stroke: var(--you); } .node.local .ring { stroke: var(--local); }
  .node.cloud .ring { stroke: var(--cloud); } .node.store .ring { stroke: var(--store); }
  .node.active .card { stroke-width: 3; }
  .node.you.active .card { stroke: var(--you); } .node.local.active .card { stroke: var(--local); } .node.cloud.active .card { stroke: var(--cloud); }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.12); } }
  .ring { transform-box: fill-box; transform-origin: center; }
  .node .title { font-size: 19px; font-weight: 700; }
  .node .sub { font-size: 14px; fill: var(--muted); }
  .badge-you { fill: var(--you); } .badge-local { fill: var(--local); } .badge-cloud { fill: var(--cloud); } .badge-store { fill: var(--store); }
  .badge-num { fill: #fff !important; font-size: 14px; font-weight: 700; }
  .chip-you { fill: var(--you-soft); } .chip-local { fill: var(--local-soft); } .chip-cloud { fill: var(--cloud-soft); } .chip-store { fill: var(--store-soft); }
  .chip-text { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
  .chip-text.you { fill: var(--you); } .chip-text.local { fill: var(--local); } .chip-text.cloud { fill: var(--cloud); } .chip-text.store { fill: var(--store); }
  .cloud-shape { fill: var(--cloud-soft); }
  .cloud-edge { fill: none; }
  .db-body { fill: var(--store-soft); stroke: var(--store); stroke-width: 2; }
  .doc-body { fill: var(--card); stroke: var(--line); stroke-width: 2; }
  .doc-fold { fill: var(--line); }
  .pdf-badge { fill: #e5484d; } .env-badge { fill: #6b6b66; }
  .ext-title { font-size: 17px; font-weight: 700; }
  .ext-sub { font-size: 13px; fill: var(--muted); }

  /* Edges */
  .edge-base { fill: none; stroke: var(--edge); stroke-width: 2.5; stroke-dasharray: 7 7; opacity: .7; }
  .edge-draw { fill: none; stroke-width: 3.5; opacity: 0; stroke-linecap: round; }
  .edge-draw.show { opacity: 1; }
  .edge-draw.done { opacity: 1; stroke-dasharray: 10 8; animation: march 1.2s linear infinite; }
  .edge-draw.blue { stroke: var(--you); } .edge-draw.orange { stroke: var(--cloud); } .edge-draw.violet { stroke: var(--store); } .edge-draw.green { stroke: var(--local); }
  @keyframes march { to { stroke-dashoffset: -36; } }

  /* Stickies */
  .sticky-pop { transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0; transition: transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s; }
  .sticky-pop.show { transform: scale(1); opacity: 1; }
  .sticky-pop rect { fill: var(--sticky); filter: drop-shadow(0 6px 10px rgba(0,0,0,.15)); }
  .sticky-pop text { font-family: Caveat, "Marker Felt", "Comic Sans MS", cursive; font-size: 23px; font-weight: 700; fill: var(--sticky-ink); }

  /* Packet */
  #packet { opacity: 0; transition: opacity .2s; }
  #packet.show { opacity: 1; }
  #packet circle.core { stroke: #fff; stroke-width: 3; }
  #packet circle.halo { opacity: .25; }
  #packet rect { stroke-width: 2; fill: var(--card); }
  #packet text { font-size: 15px; font-weight: 600; }

  /* UI overlay */
  .topbar { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
  .pill { pointer-events: auto; background: var(--ui); border-radius: 10px; box-shadow: var(--shadow); padding: 9px 14px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .pill b { font-weight: 700; }
  .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--you), var(--store)); }
  .seg { padding: 4px; gap: 2px; }
  .seg button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--you); color: #fff; }
  .legend { margin-left: auto; font-size: 12px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 4px; }

  .dock { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(720px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 10px; }
  .caption { background: var(--ui); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; }
  .caption .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; flex-wrap: wrap; }
  .caption .tag { padding: 2px 8px; border-radius: 99px; font-size: 11px; }
  .tag.you { background: var(--you-soft); color: var(--you); } .tag.local { background: var(--local-soft); color: var(--local); }
  .tag.cloud { background: var(--cloud-soft); color: var(--cloud); } .tag.store { background: var(--store-soft); color: var(--store); }
  .caption h2 { margin: 6px 0 4px; font-size: 19px; letter-spacing: -.01em; }
  .caption p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink); opacity: .85; }
  .caption code { font-family: ui-monospace, Menlo, monospace; font-size: .88em; background: var(--board); padding: 1px 5px; border-radius: 4px; }
  .controls { background: var(--ui); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: flex; align-items: center; gap: 6px; }
  .controls button { font: inherit; font-size: 14px; font-weight: 600; border: 0; background: transparent; color: var(--ink); padding: 8px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .controls button:hover { background: var(--board); }
  .controls button.primary { background: var(--you); color: #fff; min-width: 84px; }
  .progress { flex: 1; display: flex; gap: 3px; align-items: center; padding: 0 6px; min-width: 0; }
  .progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); cursor: pointer; transition: background .3s; min-width: 4px; }
  .progress span.p1.done { background: var(--you); } .progress span.p2.done { background: var(--store); } .progress span.p3.done { background: var(--local); }
  .progress span.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  .progress i { width: 6px; }
  @media (max-width: 640px) {
    .legend, .hide-sm { display: none; }
    .caption p { font-size: 13.5px; }
    .caption h2 { font-size: 17px; }
  }
</style>
</head>
<body>
<svg id="board" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="var(--dot)"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--edge)"/></marker>
  </defs>
  <rect x="-3000" y="-3000" width="8200" height="7700" fill="url(#grid)"/>
  <g id="frames"></g><g id="edges"></g><g id="nodes"></g><g id="stickies"></g>
  <g id="packet"><circle class="halo" r="20"/><circle class="core" r="10"/><rect y="-96" height="32" rx="16"/><text y="-74" text-anchor="middle"></text></g>
</svg>

<div class="topbar">
  <div class="pill"><span class="logo"></span><b>demo.ai</b><span class="hide-sm" style="color:var(--muted)">How the agent works</span></div>
  <div class="pill seg"><button data-view="high">High level</button><button data-view="low">Low level</button><button data-view="embed">Embedding</button></div>
  <div class="pill legend">
    <span><span class="dot" style="background:var(--you)"></span>You / customer</span>
    <span><span class="dot" style="background:var(--local)"></span>Runs on laptop</span>
    <span><span class="dot" style="background:var(--cloud)"></span>Google Gemini API</span>
    <span><span class="dot" style="background:var(--store)"></span>Stored data</span>
  </div>
</div>

<div class="dock">
  <div class="caption">
    <div class="meta"><span id="phase"></span><span id="count"></span><span id="tag" class="tag"></span></div>
    <h2 id="title"></h2>
    <p id="body"></p>
  </div>
  <div class="controls">
    <button id="prev" title="Previous (←)">←</button>
    <button id="play" class="primary" title="Play / pause (Space)">▶ Play</button>
    <button id="next" title="Next (→)">→</button>
    <div class="progress" id="progress"></div>
    <button id="speed" title="Speed">1×</button>
    <button id="fit" title="Show whole board">Fit</button>
  </div>
</div>

<script>
/* ---------------- Two views of the same agent; globals hold the active one ---------------- */
let FRAMES, NODES, EDGES, STICKIES, STEPS, WORLD;
const VIEWS = {};
const W = 110; // half card width
const h = (a, b, y) => `M${a + W},${y} L${b - W},${y}`;
const v = (x, y1, y2) => `M${x},${y1} L${x},${y2}`;

/* ---------------- LOW LEVEL: every step ---------------- */
VIEWS.low = (() => {
const FRAMES = [
  { x: 60, y: 60,   w: 2080, h: 440, title: "1 · INGEST  —  once per company  (python -m app.ingest)" },
  { x: 60, y: 580,  w: 2080, h: 460, title: "2 · STARTUP  —  each time the agent starts  (load_agent)" },
  { x: 60, y: 1120, w: 2080, h: 500, title: "3 · ANSWERING  —  on every message  (LangGraph: retrieve → answer)" },
];

const NODES = [
  // Ingest
  { id: "i_cmd",   x: 220,  y: 390, n: "1.1", tag: "you",   title: "Run command",  sub: "--company + PDF path(s)" },
  { id: "i_val",   x: 520,  y: 390, n: "1.2", tag: "local", title: "Validate",     sub: "exists? ends in .pdf?" },
  { id: "i_read",  x: 820,  y: 390, n: "1.3", tag: "local", title: "Read PDF",     sub: "pypdf, page by page" },
  { id: "i_split", x: 1120, y: 390, n: "1.4", tag: "local", title: "Split",        sub: "~500-char chunks" },
  { id: "i_embed", x: 1420, y: 390, n: "1.5", tag: "cloud", title: "Embed",        sub: "chunk text → vectors" },
  { id: "i_save",  x: 1720, y: 390, n: "1.6", tag: "local", title: "Save",         sub: "Chroma, temp folder" },
  { id: "i_swap",  x: 2020, y: 390, n: "1.7", tag: "local", title: "Swap in",      sub: "store/ = Company X" },
  { id: "x_pdf",   x: 820,  y: 180, type: "doc", badge: "PDF", title: "company.pdf", sub: "brochure, pricing…" },
  { id: "x_gem1",  x: 1420, y: 180, type: "cloud", title: "Google Gemini", sub: "gemini-embedding-001" },
  // Startup
  { id: "s_env",   x: 220,  y: 900, n: "2.1", tag: "local", title: "Load settings", sub: ".env → app/config.py" },
  { id: "s_co",    x: 520,  y: 900, n: "2.2", tag: "local", title: "Who am I?",     sub: "read company.json" },
  { id: "s_open",  x: 820,  y: 900, n: "2.3", tag: "local", title: "Open store",    sub: "Chroma, top 3" },
  { id: "s_model", x: 1120, y: 900, n: "2.4", tag: "local", title: "Pick model",    sub: "init_chat_model()" },
  { id: "s_graph", x: 1420, y: 900, n: "2.5", tag: "local", title: "Build graph",   sub: "retrieve → answer" },
  { id: "x_env",   x: 220,  y: 690, type: "doc", badge: "ENV", title: ".env", sub: "API key + models" },
  { id: "x_store", x: 2020, y: 690, type: "db", title: "store/", sub: "chroma/ + company.json" },
  // Answer
  { id: "a_user",  x: 220,  y: 1440, n: "3.1", tag: "you",   title: "Customer asks",  sub: "“How much is it?”" },
  { id: "a_mem",   x: 520,  y: 1440, n: "3.2", tag: "local", title: "Load memory",    sub: "history by thread_id" },
  { id: "a_query", x: 820,  y: 1440, n: "3.3", tag: "local", title: "Search text",    sub: "last 3 questions" },
  { id: "a_embq",  x: 1120, y: 1440, n: "3.4", tag: "cloud", title: "Embed question", sub: "question → vector" },
  { id: "a_find",  x: 1420, y: 1440, n: "3.5", tag: "local", title: "Find chunks",    sub: "top 3, score ≥ 0.4" },
  { id: "a_prompt",x: 1720, y: 1440, n: "3.6", tag: "local", title: "Build prompt",   sub: "rules + chunks + chat" },
  { id: "a_gen",   x: 2020, y: 1440, n: "3.7", tag: "cloud", title: "Generate",       sub: "Gemini writes reply" },
  { id: "x_ram",   x: 520,  y: 1230, type: "db", title: "Memory (RAM)", sub: "InMemorySaver" },
  { id: "x_gem2",  x: 1120, y: 1230, type: "cloud", title: "Google Gemini", sub: "gemini-embedding-001" },
  { id: "x_gem3",  x: 2020, y: 1230, type: "cloud", title: "Google Gemini", sub: "gemini-3.5-flash-lite" },
];

const EDGES = {
  e_cmd_val: [h(220, 520, 390), "blue"],      e_val_read: [h(520, 820, 390), "green"],
  e_pdf_read: [v(820, 238, 335), "violet"],   e_read_split: [h(820, 1120, 390), "green"],
  e_split_embed: [h(1120, 1420, 390), "green"],
  e_embed_gem: [v(1395, 335, 232), "orange"], e_gem_embed: [v(1445, 232, 335), "orange"],
  e_embed_save: [h(1420, 1720, 390), "green"], e_save_swap: [h(1720, 2020, 390), "green"],
  e_swap_store: [v(2020, 445, 630), "violet"],
  e_env_senv: [v(220, 748, 845), "violet"],   e_senv_co: [h(220, 520, 900), "green"],
  e_store_co: ["M1995,752 C1995,1030 520,1030 520,955", "violet"],
  e_co_open: [h(520, 820, 900), "green"],
  e_store_open: ["M2020,754 C2020,1000 820,1000 820,955", "violet"],
  e_open_model: [h(820, 1120, 900), "green"], e_model_graph: [h(1120, 1420, 900), "green"],
  e_user_mem: [h(220, 520, 1440), "blue"],    e_ram_mem: [v(520, 1292, 1385), "violet"],
  e_mem_query: [h(520, 820, 1440), "green"],  e_query_embq: [h(820, 1120, 1440), "green"],
  e_embq_gem: [v(1095, 1385, 1280), "orange"], e_gem_embq: [v(1145, 1280, 1385), "orange"],
  e_embq_find: [h(1120, 1420, 1440), "green"],
  e_store_find: ["M2060,748 C2060,1090 1420,1090 1420,1385", "violet"],
  e_find_prompt: [h(1420, 1720, 1440), "green"], e_prompt_gen: [h(1720, 2020, 1440), "green"],
  e_gen_gem: [v(1995, 1385, 1280), "orange"], e_gem_gen: [v(2045, 1280, 1385), "orange"],
  e_gen_mem: ["M1990,1495 C1990,1555 540,1555 540,1495", "violet"],
  e_gen_user: ["M2050,1495 C2050,1612 220,1612 220,1495", "blue"],
};

const STICKIES = {
  st_cmd:   [220, 185, -2,   "Company name comes\nONLY from here.\nNothing hardcoded"],
  st_val:   [520, 185, 1.5,  "Bad file? Stops\nhere — current\ncompany untouched"],
  st_split: [1120, 185, -1.5,"500 chars / chunk\n80 overlap so no\nsentence is lost"],
  st_save:  [1720, 185, 2,   "Built in temp folder.\nAPI fails? Old\ncompany stays"],
  st_swap:  [2020, 185, -2,  "company.json:\n{ company:\n  \"Company X\" }"],
  st_co:    [520, 695, -1.5, "No store/?\n→ \"Run ingest\n   first\""],
  st_open:  [820, 695, 2,    "Must use SAME\nembedding model\nas ingest!"],
  st_model: [1120, 695, -2,  "No API call yet.\nSwap model by\nediting .env"],
  st_graph: [1420, 695, 1.5, "START → retrieve\n→ answer → END\n+ memory saver"],
  st_user:  [220, 1235, -2,  "thread_id =\n\"terminal\" (later:\nWhatsApp number)"],
  st_query: [820, 1235, 1.5, "Q1 + Q2 + Q3\nso \"it\" still means\nthe course"],
  st_prompt:[1720, 1235, -1.5,"ONLY use context ·\nrefuse off-topic ·\nnever invent"],
};

/* ---------------- Story ---------------- */
const STEPS = [
  { phase: "Overview", title: "How the agent works", tag: "",
    body: "Three stages: <b>Ingest</b> turns a company PDF into searchable data, <b>Startup</b> loads it, and <b>Answering</b> runs on every customer message. Press <b>▶ Play</b> or Space. You can drag to pan and scroll to zoom." },
  // 1 · Ingest
  { p: 1, node: "i_cmd", sticky: "st_cmd", tag: "you", title: "You run the ingest command",
    body: "<code>python -m app.ingest --company \"Company X\" x.pdf</code>. This one command decides which company the agent represents." },
  { p: 1, node: "i_val", sticky: "st_val", flows: [["e_cmd_val", "x.pdf"]], tag: "local", title: "Validate the files",
    body: "Every path must exist and end in <code>.pdf</code>. If not, it stops with <code>Not a PDF file</code> before touching anything." },
  { p: 1, node: "i_read", flows: [["e_val_read", "path"], ["e_pdf_read", "page text"]], tag: "local", title: "Read the PDF, page by page",
    body: "<code>pypdf</code> pulls the text out of each page. Each page becomes a <code>Document</code> with its text plus the file name and page number." },
  { p: 1, node: "i_split", sticky: "st_split", flows: [["e_read_split", "24 pages"]], tag: "local", title: "Split into chunks",
    body: "<code>RecursiveCharacterTextSplitter</code> cuts pages into roughly 500-character pieces, splitting on paragraphs first, then lines, then words." },
  { p: 1, node: "i_embed", flows: [["e_split_embed", "61 chunks"], ["e_embed_gem", "chunk text"], ["e_gem_embed", "[0.01, -0.08, …]"]], tag: "cloud", title: "Embed: text → vectors (Gemini)",
    body: "Each chunk's text goes to Google's <code>gemini-embedding-001</code>, which returns a <b>vector</b>: a long list of numbers that captures the chunk's meaning. This is the only time PDF text leaves your laptop during ingest." },
  { p: 1, node: "i_save", sticky: "st_save", flows: [["e_embed_save", "chunks + vectors"]], tag: "local", title: "Save into Chroma",
    body: "The chunks, their vectors and their metadata go into a local Chroma vector database, built in a temporary folder first." },
  { p: 1, node: "i_swap", sticky: "st_swap", flows: [["e_save_swap", "temp folder"], ["e_swap_store", "store/"]], tag: "store", title: "Swap in the new company",
    body: "It writes <code>company.json</code>, deletes the old <code>store/</code> and renames the temp folder. The agent is now Company X's assistant." },
  // 2 · Startup

  const outer = el("g", { transform: `translate(${x},${y}) rotate(${rot})` }, $("stickies"));
  const pop = el("g", { class: "sticky-pop" }, outer);
  el("rect", { x: -100, y: -58, width: 200, height: 116, rx: 3 }, pop);
  text.split("\n").forEach((line, i) => el("text", { x: -86, y: -24 + i * 26 }, pop, line));
  stickyEls[id] = pop;
}
buildProgress();
}

/* ---------------- Camera ---------------- */
let cam = { x: 0, y: 0, w: 2200, h: 1680 };
const applyCam = () => svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${cam.w} ${cam.h}`);
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// Fit a world rect into the visible area above the caption dock.
function fitRect(r) {
  const vw = svg.clientWidth, vh = svg.clientHeight;
  const dockH = document.querySelector(".dock").offsetHeight + 24, topH = 64;
  const availH = Math.max(120, vh - dockH - topH);
  const s = Math.max(r.w / (vw - 32), r.h / availH);           // world units per pixel
  const w = vw * s, hh = vh * s;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const offsetPx = (topH - dockH) / 2;                         // shift center into free area
  return { x: cx - w / 2, y: cy - hh / 2 - offsetPx * s, w, h: hh };
}

let camAnim = 0;
function moveCam(target, ms) {
  const from = { ...cam }, t0 = performance.now(), id = ++camAnim;
  return new Promise(res => {
    const f = now => {
      if (id !== camAnim) return res();
      const t = Math.min(1, (now - t0) / ms), e = ease(t);
      for (const k of ["x", "y", "w", "h"]) cam[k] = from[k] + (target[k] - from[k]) * e;
      applyCam();
      t < 1 ? requestAnimationFrame(f) : res();
    };
    requestAnimationFrame(f);
  });
}

function stepRect(s) {
  if (!s.node) return WORLD;
  const pts = [];
  const add = (x1, y1, x2, y2) => pts.push([x1, y1], [x2, y2]);
  const n = NODES.find(n => n.id === s.node);
  add(n.x - 140, n.y - 80, n.x + 140, n.y + 80);
  if (s.sticky) { const [x, y] = STICKIES[s.sticky]; add(x - 120, y - 80, x + 120, y + 80); }
  for (const [e] of s.flows || []) { const b = edgeEls[e].draw.getBBox(); add(b.x - 140, b.y - 70, b.x + b.width + 140, b.y + b.height + 70); }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let x = Math.min(...xs), y = Math.min(...ys), w = Math.max(...xs) - x, hh = Math.max(...ys) - y;
  if (w < 1150) { x -= (1150 - w) / 2; w = 1150; }
  return { x, y, w, h: hh };
}

/* ---------------- Player ---------------- */
let cur = 0, playing = false, speed = 1, token = 0;
const packet = $("packet"), pText = packet.querySelector("text"), pRect = packet.querySelector("rect");
const COLORS = { blue: "var(--you)", orange: "var(--cloud)", violet: "var(--store)", green: "var(--local)" };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function runFlow(edgeId, label, tk) {
  const e = edgeEls[edgeId], c = COLORS[e.color];
  pText.textContent = label;
  const tw = pText.getComputedTextLength() + 28;
  pRect.setAttribute("x", -tw / 2); pRect.setAttribute("width", tw); pRect.style.stroke = c;
  packet.querySelectorAll("circle").forEach(ci => ci.style.fill = c);
  pText.style.fill = c;
  packet.classList.add("show");
  e.draw.classList.remove("done"); e.draw.classList.add("show");
  e.draw.style.strokeDasharray = e.len; e.draw.style.strokeDashoffset = e.len;
  const D = Math.max(900, e.len * 2.2) / speed, t0 = performance.now();
  return new Promise(res => {
    const f = now => {
      if (tk !== token) return res();
      const t = Math.min(1, (now - t0) / D), k = ease(t);
      const p = e.draw.getPointAtLength(k * e.len);
      packet.setAttribute("transform", `translate(${p.x},${p.y})`);
      e.draw.style.strokeDashoffset = e.len * (1 - k);
      if (t < 1) return requestAnimationFrame(f);
      e.draw.style.strokeDasharray = ""; e.draw.style.strokeDashoffset = "";
      e.draw.classList.add("done");
      packet.classList.remove("show");
      res();
    };
    requestAnimationFrame(f);
  });
}

// Static state: everything up to step i-1 done; step i's flows not yet drawn.
function setState(i) {
  const doneEdges = new Set(), onNodes = new Set(), shown = new Set();
  STEPS.forEach((s, k) => {
    if (k > i || !s.node) return;
    onNodes.add(s.node);
    if (s.sticky) shown.add(s.sticky);
    for (const [e] of s.flows || []) {
      if (k < i) doneEdges.add(e);
      // light up the external boxes this flow touches
      const d = EDGES[e][0];
      for (const n of NODES) if (n.type && pathTouches(d, n)) onNodes.add(n.id);
    }
  });
  for (const [id, g] of Object.entries(nodeEls)) {
    g.classList.toggle("on", i === 0 || onNodes.has(id));
    g.classList.toggle("active", STEPS[i].node === id);
  }
  for (const [id, e] of Object.entries(edgeEls)) {
    e.draw.style.strokeDasharray = ""; e.draw.style.strokeDashoffset = "";
    e.draw.classList.toggle("show", doneEdges.has(id));
    e.draw.classList.toggle("done", doneEdges.has(id));
  }
  for (const [id, p] of Object.entries(stickyEls)) p.classList.toggle("show", i === 0 ? false : shown.has(id) && id !== STEPS[i].sticky);
  packet.classList.remove("show");
}
function pathTouches(d, n) {
  const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
  const pts = [[nums[0], nums[1]], [nums[nums.length - 2], nums[nums.length - 1]]];
  return pts.some(([x, y]) => Math.abs(x - n.x) < 120 && Math.abs(y - n.y) < 90);
}

function setCaption(i) {
  const s = STEPS[i];
  $("phase").textContent = s.p ? FRAMES[s.p - 1].title.split("—")[0].trim() : "Overview";
  $("count").textContent = i ? `· Step ${i} of ${STEPS.length - 1}` : "";
  const tag = $("tag");
  tag.className = "tag " + (s.tag || ""); tag.textContent = s.tag ? TAGTXT[s.tag] : ""; tag.style.display = s.tag ? "" : "none";
  $("title").textContent = s.title;
  $("body").innerHTML = s.body;
  [...$("progress").querySelectorAll("span")].forEach(sp => {
    const k = +sp.dataset.i; sp.classList.toggle("done", k <= i); sp.classList.toggle("cur", k === i);
  });
}

async function go(i, animate = true) {
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const tk = ++token, s = STEPS[cur];
  setState(cur); setCaption(cur);
  const camMs = animate ? 1000 / speed : 0;
  if (camMs) await moveCam(fitRect(stepRect(s)), camMs); else { cam = fitRect(stepRect(s)); applyCam(); }
  if (tk !== token) return;
  for (const [e, label] of s.flows || []) {
    await runFlow(e, label, tk);
    if (tk !== token) return;
  }
  if (s.sticky) stickyEls[s.sticky].classList.add("show");
  if (!playing) return;
  await sleep(2600 / speed);
  if (tk !== token || !playing) return;
  if (cur < STEPS.length - 1) go(cur + 1);
  else setPlaying(false);
}

function setPlaying(p) {
  playing = p;
  $("play").textContent = p ? "❚❚ Pause" : "▶ Play";
  if (p) go(cur === 0 || cur === STEPS.length - 1 ? 1 : cur);
}

function buildProgress() {
  $("progress").innerHTML = "";
  STEPS.forEach((s, i) => {
    if (i > 1 && s.p !== STEPS[i - 1].p) $("progress").appendChild(document.createElement("i"));
    const sp = document.createElement("span");
    sp.dataset.i = i; sp.className = "p" + (s.p || 1); sp.title = s.title;
    sp.onclick = () => { setPlaying(false); go(i); };
    $("progress").appendChild(sp);
  });
}

function setView(name) {
  setPlaying(false); token++; camAnim++;
  ({ FRAMES, NODES, EDGES, STICKIES, STEPS, WORLD } = VIEWS[name]);
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.view === name));
  build();
  go(0, false);
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setView(b.dataset.view));

$("play").onclick = () => setPlaying(!playing);
$("next").onclick = () => { setPlaying(false); go(cur + 1); };
$("prev").onclick = () => { setPlaying(false); go(cur - 1); };
$("fit").onclick = () => { token++; camAnim++; moveCam(fitRect(WORLD), 800); };
$("speed").onclick = () => { speed = speed === 1 ? 1.6 : speed === 1.6 ? 0.6 : 1; $("speed").textContent = { 1: "1×", 1.6: "1.6×", 0.6: "0.6×" }[speed]; };
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
});
addEventListener("resize", () => { cam = fitRect(stepRect(STEPS[cur])); applyCam(); });

/* ---------------- Pan & zoom (like a whiteboard) ---------------- */
const scale = () => Math.max(cam.w / svg.clientWidth, cam.h / svg.clientHeight);
let drag = null;
svg.addEventListener("pointerdown", e => { camAnim++; drag = { x: e.clientX, y: e.clientY }; svg.classList.add("dragging"); svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const s = scale();
  cam.x -= (e.clientX - drag.x) * s; cam.y -= (e.clientY - drag.y) * s;
  drag = { x: e.clientX, y: e.clientY }; applyCam();
});
svg.addEventListener("pointerup", () => { drag = null; svg.classList.remove("dragging"); });
svg.addEventListener("wheel", e => {
  e.preventDefault(); camAnim++;
  const s = scale(), f = Math.exp(e.deltaY * 0.0015);
  const r = svg.getBoundingClientRect();
  // world point under cursor stays fixed
  const ox = (svg.clientWidth - cam.w / s) / 2, oy = (svg.clientHeight - cam.h / s) / 2;
  const wx = cam.x + (e.clientX - r.left - ox) * s, wy = cam.y + (e.clientY - r.top - oy) * s;
  const nw = Math.min(6000, Math.max(300, cam.w * f)), k = nw / cam.w;
  cam = { x: wx - (wx - cam.x) * k, y: wy - (wy - cam.y) * k, w: nw, h: cam.h * k };
  applyCam();
}, { passive: false });

// ?view=low|embed&step=N opens directly on a view/step (handy for sharing a specific moment)
document.fonts.ready.then(() => {
  const q = new URLSearchParams(location.search);
  setView(VIEWS[q.get("view")] ? q.get("view") : "high");
  if (q.get("step")) go(+q.get("step"), false);
});
</script>
</body>
</html>
